[project]
name = "auraframes"
version = "0.1.0"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2",
    "httpx[http2]>=0.27",
    "h2>=4",
    "requests>=2.31",
    "boto3>=1.34",
    "botocore>=1.34",
    "Pillow>=10.4",
    # D-09: HEIC uploads go to S3 as-is, with data_uti set to 'public.heic'
    # and the original bytes untouched. Transcoding to JPEG was rejected --
    # it would make the uploaded bytes differ from the source file, so the
    # md5_hash diffing contract would compare a local original against a
    # transcoded remote and every run would risk seeing every photo as
    # changed.
    "pillow-heif>=1.6",
    "piexif>=1.1.3",
    "geopy>=2.4",
    "loguru>=0.7",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
google-browser = [
    "playwright>=1.63.0",
]

[project.scripts]
aura-cli = "auraframes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "live: hits the live Aura API; requires AURA_EMAIL/AURA_PASSWORD. Deselect with -m 'not live'.",
]
