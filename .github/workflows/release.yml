# Release engineering (phase 22, REL-01/02, PYI-01/02).
#
# One action = push a tag `vX.Y.Z`. The workflow:
#   check   — the tag MUST equal pyproject's version AND pushframe.__version__
#             (the release builds nothing on mismatch; version lives in
#             exactly one place, the tag only names the release)
#   pypi-test — upload to TestPyPI via TRUSTED PUBLISHING (OIDC; no PyPI
#             token exists anywhere). Requires the one-time TestPyPI
#             "trusted publisher" declaration — see
#             .planning/phases/22-pypi-release-engineering/OPERATOR-STEPS.md
#   deb     — build the hermetic .deb (PUSHFRAME_DEB_OUT_DIR keeps dist/
#             intact), attach to the GitHub Release
#   apt     — republish the signed APT repo to gh-pages (signing key from
#             the PUSHFRAME_APT_SIGNING_KEY secret; assembled by the same
#             scripts/publish-apt-repo.sh used locally)
#   pypi    — upload to real PyPI, same OIDC recipe (gated on pypi-test)
#
# Trusted publishing rules (D-01): `permissions: id-token: write` on every
# publishing job, `uv publish --trusted-publishing automatic`, publisher
# declarations must name THIS workflow file (release.yml) and the
# `release` environment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the GitHub Release, push gh-pages (apt job)
  id-token: write        # PyPI/TestPyPI trusted publishing (OIDC)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag == pyproject == pushframe.__version__
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_V=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_V=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('pushframe/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PYPROJECT_V __init__=$INIT_V"
          if [ "$TAG" != "$PYPROJECT_V" ] || [ "$TAG" != "$INIT_V" ]; then
              echo "::error::version mismatch — tag v$TAG vs pyproject $PYPROJECT_V vs __init__ $INIT_V"
              exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  pypi-test:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Upload to TestPyPI (trusted publishing — rehearsal)
        run: uv publish --trusted-publishing automatic
             --publish-url https://test.pypi.org/legacy/ dist/*

  deb:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install uv-managed standalone python (the deb's runtime)
        run: uv python install 3.14
      - name: Build the hermetic .deb
        run: PUSHFRAME_DEB_OUT_DIR=build/release/deb ./scripts/build-deb.sh
      - name: Create the GitHub Release with the .deb asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
              --title "pushframe v${VERSION}" \
              --notes "Unofficial community CLI for Aura Frames (not affiliated). \
          Install: see the README (deb / APT / uv tool install)." \
              "build/release/deb/pushframe_${VERSION}_amd64.deb"

  apt:
    needs: deb
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Restore the APT signing key from the secret
        env:
          PUSHFRAME_APT_SIGNING_KEY: ${{ secrets.PUSHFRAME_APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          KEYDIR="$HOME/.config/pushframe-apt-key"
          install -d -m 700 "$KEYDIR"
          printf '%s\n' "$PUSHFRAME_APT_SIGNING_KEY" > "$KEYDIR/signing-key.asc"
          chmod 600 "$KEYDIR/signing-key.asc"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg dpkg-dev >/dev/null
          # derive the fingerprint with gpg (the ASCII armor does not carry
          # it as text — a grep-based extraction fails and killed the first
          # release run)
          gpg --import "$KEYDIR/signing-key.asc" 2>/dev/null
          FP=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          printf '%s\n' "$FP" > "$KEYDIR/fingerprint"
          echo "signing key restored: $FP"
      - name: Rebuild + republish the APT repository (gh-pages)
        env:
          APT_GIT_AUTHOR: pushframe-release-bot <coredmp95@gmail.com>
        run: |
          uv python install 3.14
          ./scripts/publish-apt-repo.sh

  pypi:
    needs: [pypi-test, deb]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Upload to PyPI (trusted publishing)
        run: uv publish --trusted-publishing automatic dist/*
