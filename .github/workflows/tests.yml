name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the offline test suite (no credentials, no network)
        run: uv run --extra dev pytest -q -m "not live"
